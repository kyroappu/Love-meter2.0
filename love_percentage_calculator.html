<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f87">
  <title>Love Percentage Calculator 💖</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #54223b; background: linear-gradient(135deg, #ffe2ec, #fff2f7 55%, #ffd2e4);
      overflow-x: hidden;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .heart { position: absolute; bottom: -50px; opacity: .35; animation: floatUp linear infinite; }
    @keyframes floatUp { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
    .card {
      position: relative; z-index: 1; width: min(100%, 440px); padding: 30px 24px;
      border: 1px solid rgba(255,255,255,.85); border-radius: 28px;
      background: rgba(255,255,255,.88); box-shadow: 0 18px 55px rgba(173, 49, 103, .16);
      text-align: center;
    }
    .emoji { font-size: 54px; line-height: 1.2; }
    h1 { margin: 10px 0 8px; font-size: clamp(27px, 7vw, 34px); color: #e73578; }
    .subtitle { margin: 0 0 24px; color: #87556c; line-height: 1.5; }
    label { display: block; text-align: left; margin: 14px 0 7px; font-weight: 700; font-size: 14px; }
    input {
      width: 100%; padding: 14px 15px; border: 2px solid #f6c2d6; border-radius: 14px;
      outline: none; font-size: 16px; color: #54223b; background: #fffafd;
    }
    input:focus { border-color: #ed5790; box-shadow: 0 0 0 3px #ffe2ed; }
    button {
      width: 100%; border: 0; border-radius: 15px; padding: 15px 18px; margin-top: 20px;
      font-size: 16px; font-weight: 800; color: white; cursor: pointer;
      background: linear-gradient(100deg, #ff6398, #e73578); box-shadow: 0 8px 18px #f4a4c2;
      transition: transform .15s ease, filter .15s ease;
    }
    button:active { transform: scale(.98); }
    #result { display: none; margin-top: 24px; animation: pop .35s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .names { font-weight: 800; overflow-wrap: anywhere; }
    .percent { font-size: 52px; font-weight: 900; color: #e73578; margin: 5px 0 10px; }
    .meter { height: 14px; background: #ffe2ed; border-radius: 99px; overflow: hidden; }
    .meter-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #ff9abc, #e73578); transition: width .8s ease; }
    .message { margin: 14px 0 0; line-height: 1.5; }
    .note { margin: 22px 0 0; font-size: 12px; color: #a4778c; }
    .small-button { background: #fff0f6; color: #d83273; box-shadow: none; border: 1px solid #f7c5d9; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <main class="card">
    <div class="emoji" aria-hidden="true">💘</div>
    <h1>Love Calculator</h1>
    <p class="subtitle">Two names, one little love test. Find out your love percentage! 💕</p>

    <form id="loveForm">
      <label for="yourName">Your name</label>
      <input id="yourName" name="yourName" placeholder="Enter your name" maxlength="40" required autocomplete="given-name">
      <label for="crushName">Your crush's name</label>
      <input id="crushName" name="crushName" placeholder="Enter their name" maxlength="40" required>
      <button type="submit">Calculate Love ❤️</button>
    </form>

    <section id="result" aria-live="polite">
      <div class="names" id="pairNames"></div>
      <div class="percent" id="percentage">0%</div>
      <div class="meter" role="progressbar" aria-label="Love percentage" aria-valuemin="0" aria-valuemax="100" id="meter">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <p class="message" id="message"></p>
      <button type="button" class="small-button" id="tryAgain">Try another pair 💞</button>
    </section>
    <p class="note">Just for fun — real love can't be measured by a calculator. 💗</p>
  </main>

  <script>
    // A consistent playful result: the same pair of names gets the same percentage.
    function loveScore(a, b) {
      const names = [a.trim().toLocaleLowerCase(), b.trim().toLocaleLowerCase()].sort();
      const text = names.join('|');
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (Math.abs(hash) % 101);
    }

    const form = document.getElementById('loveForm');
    const result = document.getElementById('result');
    const fill = document.getElementById('meterFill');
    const meter = document.getElementById('meter');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const a = document.getElementById('yourName').value.trim();
      const b = document.getElementById('crushName').value.trim();
      if (!a || !b) return;
      const score = loveScore(a, b);
      document.getElementById('pairNames').textContent = a + ' 💗 ' + b;
      document.getElementById('percentage').textContent = score + '%';
      meter.setAttribute('aria-valuenow', score);
      fill.style.width = score + '%';
      let message;
      if (score >= 90) message = 'A perfect match vibe! 💍✨';
      else if (score >= 75) message = 'A lovely connection! Keep that spark alive. 💖';
      else if (score >= 50) message = 'There could be a cute spark here! 😊';
      else if (score >= 25) message = 'A little mystery makes things exciting. 🌷';
      else message = 'Maybe friendship is where the magic starts! 🌈';
      document.getElementById('message').textContent = message;
      result.style.display = 'block';
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    document.getElementById('tryAgain').addEventListener('click', function () {
      form.reset();
      result.style.display = 'none';
      fill.style.width = '0';
      document.getElementById('yourName').focus();
    });

    const hearts = document.getElementById('hearts');
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = ['💗', '💕', '💖', '♥'][i % 4];
      heart.style.left = (Math.random() * 100) + '%';
      heart.style.fontSize = (14 + Math.random() * 20) + 'px';
      heart.style.animationDuration = (8 + Math.random() * 12) + 's';
      heart.style.animationDelay = (-Math.random() * 15) + 's';
      hearts.appendChild(heart);
    }
  </script>
</body>
</html>
